name: Elixpoo rollout audit

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Optional repository name without owner
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - config/elixpoo_rollout.yaml
      - distribution/workflows/**
      - .github/workflows/elixpoo-*-reusable.yml

permissions:
  contents: read

concurrency:
  group: elixpoo-rollout-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Compare manifest with live callers
        env:
          ELIXPOO_GITHUB_AGENTIC_TOKEN: ${{ secrets.ELIXPOO_GITHUB_AGENTIC_TOKEN }}
          REPOSITORY: ${{ inputs.repository }}
        run: |
          args=()
          if [[ -n "$REPOSITORY" ]]; then args+=(--repo "$REPOSITORY"); fi
          python -m agents.rollout_audit "${args[@]}"
