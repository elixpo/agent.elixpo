# Deploys agent.elixpo.com (static export, including the generated festive theme)
# through the shared Pages workflow, on every change to the site or the festive calendar.

name: Deploy agent.elixpo.com

on:
  push:
    branches: [main]
    paths:
      - agent.elixpo/**
      - config/festivals.yaml
      - .github/workflows/deploy-site.yml
      - .github/workflows/deploy-cloudflare-pages.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pages:
    uses: ./.github/workflows/deploy-cloudflare-pages.yml
    with:
      project-name: agent-elixpo-web
      working-directory: agent.elixpo
      build-command: npm run build
      output-directory: out
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
