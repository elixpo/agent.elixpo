# Reusable Cloudflare Workers deploy for the Elixpo CI network.
# Covers plain Workers (`wrangler deploy`) and OpenNext apps (build, then `wrangler deploy`).
#
#   jobs:
#     deploy:
#       uses: elixpo/agent.elixpo/.github/workflows/deploy-cloudflare-worker.yml@main
#       with:
#         working-directory: workers/api
#       secrets: inherit
#
# Optional: build-command (e.g. `npx opennextjs-cloudflare build`), wrangler-env, sops-file +
# secret-keys (synced with `wrangler secret bulk`), and d1-database migrations.

name: Deploy Cloudflare Worker

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing wrangler.toml / wrangler.jsonc
        type: string
        default: "."
      node-version:
        type: string
        default: "22"
      build-command:
        description: Optional build before deploying (OpenNext, bundling)
        type: string
        default: ""
      wrangler-env:
        description: Wrangler environment (--env) to deploy, empty for the top level
        type: string
        default: ""
      pre-build-command:
        type: string
        default: ""
      build-env:
        description: Public build-time variables, one KEY=VALUE per line
        type: string
        default: ""
      sops-file:
        type: string
        default: ""
      sops-output:
        type: string
        default: .env.local
      secret-keys:
        description: Space-separated keys or globs from the decrypted env to sync as Worker secrets ("all" or * for every key)
        type: string
        default: ""
      secret-exclude:
        description: Space-separated keys or globs (e.g. NEXT_PUBLIC_*) left out of secret-keys; keys named exactly in secret-keys still sync
        type: string
        default: ""
      secret-map:
        description: Secrets synced under another name, one TARGET=SOURCE_KEY per line (value read from the decrypted env)
        type: string
        default: ""
      secret-values:
        description: Non-secret constants synced as runtime variables, one KEY=value per line
        type: string
        default: ""
      d1-database:
        type: string
        default: ""
      environment:
        type: string
        default: production
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      SOPS_AGE_KEY:
        required: false
      CI_SOPS_AGE_KEY:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    concurrency:
      group: worker-${{ github.repository }}-${{ inputs.working-directory }}-${{ inputs.wrangler-env }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_ENV: ${{ inputs.wrangler-env }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) != '' && 'npm' || '' }}
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci
          elif [ -f package.json ]; then npm install --no-audit --no-fund
          else echo "No package.json here; wrangler runs through npx."
          fi

      - name: Decrypt environment
        if: inputs.sops-file != ''
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY || secrets.CI_SOPS_AGE_KEY }}
          SOPS_FILE: ${{ inputs.sops-file }}
          SOPS_OUTPUT: ${{ inputs.sops-output }}
        run: |
          if [ -z "$SOPS_AGE_KEY" ]; then echo "::error::sops-file is set but no SOPS_AGE_KEY or CI_SOPS_AGE_KEY secret is available"; exit 1; fi
          curl -fsSLo /tmp/sops https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          echo "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  /tmp/sops" | sha256sum --check --quiet
          chmod +x /tmp/sops
          /tmp/sops --decrypt --input-type dotenv --output-type dotenv "$SOPS_FILE" > "$SOPS_OUTPUT"
          while IFS='=' read -r key value; do
            [ -n "$value" ] && [ "${key#\#}" = "$key" ] && echo "::add-mask::$value"
          done < "$SOPS_OUTPUT"

      - name: Set build variables
        if: inputs.build-env != ''
        env:
          BUILD_ENV: ${{ inputs.build-env }}
        run: printf '%s\n' "$BUILD_ENV" | grep -E '^[A-Z_][A-Z0-9_]*=' >> "$GITHUB_ENV"

      - name: Pre-build checks
        if: inputs.pre-build-command != ''
        env:
          COMMAND: ${{ inputs.pre-build-command }}
        run: bash -euo pipefail -c "$COMMAND"

      - name: Sync Worker secrets
        if: inputs.secret-values != '' || (inputs.sops-file != '' && (inputs.secret-keys != '' || inputs.secret-map != ''))
        env:
          KEYS: ${{ inputs.secret-keys }}
          EXCLUDE: ${{ inputs.secret-exclude }}
          MAP: ${{ inputs.secret-map }}
          VALUES: ${{ inputs.secret-values }}
          SOPS_OUTPUT: ${{ inputs.sops-output }}
        run: |
          cat > /tmp/build-secrets.cjs <<'JS'
          const fs = require("fs");
          const env = {};
          if (process.env.SOPS_OUTPUT && fs.existsSync(process.env.SOPS_OUTPUT)) {
            for (const line of fs.readFileSync(process.env.SOPS_OUTPUT, "utf8").split("\n")) {
              const m = line.match(/^([A-Za-z_][A-Za-z0-9_]*)=(.*)$/);
              if (m) env[m[1]] = m[2].replace(/^"(.*)"$/, "$1");
            }
          }
          const words = (value) => (value || "").split(/\s+/).filter(Boolean);
          const pattern = (glob) => new RegExp("^" + glob.replace(/[.+?^${}()|[\]\\]/g, "\\$&").replace(/\*/g, ".*") + "$");
          const include = words(process.env.KEYS).map((k) => (k === "all" ? "*" : k));
          const exclude = words(process.env.EXCLUDE);
          const named = new Set(include.filter((k) => !k.includes("*")));
          const out = {};
          for (const [key, value] of Object.entries(env)) {
            if (key.startsWith("CLOUDFLARE_") || !value) continue;
            if (!include.some((p) => pattern(p).test(key))) continue;
            if (!named.has(key) && exclude.some((p) => pattern(p).test(key))) continue;
            out[key] = value;
          }
          for (const line of (process.env.MAP || "").split("\n").map((l) => l.trim()).filter(Boolean)) {
            const m = line.match(/^([A-Za-z_][A-Za-z0-9_]*)=([A-Za-z_][A-Za-z0-9_]*)$/);
            if (!m || !env[m[2]]) { console.error(`::error::secret-map entry "${line}" needs TARGET=SOURCE with a non-empty SOURCE in the decrypted env`); process.exit(1); }
            out[m[1]] = env[m[2]];
          }
          for (const line of (process.env.VALUES || "").split("\n").map((l) => l.trim()).filter(Boolean)) {
            const m = line.match(/^([A-Za-z_][A-Za-z0-9_]*)=(.+)$/);
            if (!m) { console.error(`::error::secret-values entry "${line}" must be KEY=value`); process.exit(1); }
            out[m[1]] = m[2];
          }
          fs.writeFileSync(process.argv[2], JSON.stringify(out));
          console.log(`syncing ${Object.keys(out).length} secret(s): ${Object.keys(out).sort().join(", ")}`);
          JS
          node /tmp/build-secrets.cjs /tmp/runtime-secrets.json
          npx --yes wrangler secret bulk /tmp/runtime-secrets.json ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}
          rm -f /tmp/runtime-secrets.json /tmp/build-secrets.cjs

      - name: Build
        if: inputs.build-command != ''
        env:
          COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$COMMAND"

      - name: Apply D1 migrations
        if: inputs.d1-database != ''
        env:
          DATABASE: ${{ inputs.d1-database }}
        run: npx --yes wrangler d1 migrations apply "$DATABASE" --remote ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

      - name: Deploy
        run: npx --yes wrangler deploy ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

      - name: Summary
        if: always()
        env:
          DIRECTORY: ${{ inputs.working-directory }}
          STATUS: ${{ job.status }}
        run: |
          echo "Cloudflare Worker in \`$DIRECTORY\` ${WRANGLER_ENV:+(env $WRANGLER_ENV) }deploy of \`${GITHUB_SHA::7}\`: **$STATUS**" >> "$GITHUB_STEP_SUMMARY"
