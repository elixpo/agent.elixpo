# Reusable Cloudflare Workers deploy for the Elixpo CI network.
# Covers plain Workers (`wrangler deploy`) and OpenNext apps (build, then `wrangler deploy`).
#
#   jobs:
#     deploy:
#       uses: elixpo/agent.elixpo/.github/workflows/deploy-cloudflare-worker.yml@main
#       with:
#         working-directory: workers/api
#       secrets: inherit
#
# Optional: build-command (e.g. `npx opennextjs-cloudflare build`), wrangler-env, sops-file +
# secret-keys (synced with `wrangler secret bulk`), and d1-database migrations.

name: Deploy Cloudflare Worker

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing wrangler.toml / wrangler.jsonc
        type: string
        default: "."
      node-version:
        type: string
        default: "22"
      build-command:
        description: Optional build before deploying (OpenNext, bundling)
        type: string
        default: ""
      wrangler-env:
        description: Wrangler environment (--env) to deploy, empty for the top level
        type: string
        default: ""
      pre-build-command:
        type: string
        default: ""
      build-env:
        description: Public build-time variables, one KEY=VALUE per line
        type: string
        default: ""
      sops-file:
        type: string
        default: ""
      sops-output:
        type: string
        default: .env.local
      secret-keys:
        description: Space-separated keys from the decrypted env to sync as Worker secrets, or "all"
        type: string
        default: ""
      d1-database:
        type: string
        default: ""
      environment:
        type: string
        default: production
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      SOPS_AGE_KEY:
        required: false
      CI_SOPS_AGE_KEY:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    concurrency:
      group: worker-${{ github.repository }}-${{ inputs.working-directory }}-${{ inputs.wrangler-env }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_ENV: ${{ inputs.wrangler-env }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Decrypt environment
        if: inputs.sops-file != ''
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY || secrets.CI_SOPS_AGE_KEY }}
          SOPS_FILE: ${{ inputs.sops-file }}
          SOPS_OUTPUT: ${{ inputs.sops-output }}
        run: |
          if [ -z "$SOPS_AGE_KEY" ]; then echo "::error::sops-file is set but no SOPS_AGE_KEY or CI_SOPS_AGE_KEY secret is available"; exit 1; fi
          curl -fsSLo /tmp/sops https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          echo "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  /tmp/sops" | sha256sum --check --quiet
          chmod +x /tmp/sops
          /tmp/sops --decrypt --input-type dotenv --output-type dotenv "$SOPS_FILE" > "$SOPS_OUTPUT"
          while IFS='=' read -r key value; do
            [ -n "$value" ] && [ "${key#\#}" = "$key" ] && echo "::add-mask::$value"
          done < "$SOPS_OUTPUT"

      - name: Set build variables
        if: inputs.build-env != ''
        env:
          BUILD_ENV: ${{ inputs.build-env }}
        run: printf '%s\n' "$BUILD_ENV" | grep -E '^[A-Z_][A-Z0-9_]*=' >> "$GITHUB_ENV"

      - name: Pre-build checks
        if: inputs.pre-build-command != ''
        env:
          COMMAND: ${{ inputs.pre-build-command }}
        run: bash -euo pipefail -c "$COMMAND"

      - name: Sync Worker secrets
        if: inputs.secret-keys != '' && inputs.sops-file != ''
        env:
          KEYS: ${{ inputs.secret-keys }}
          SOPS_OUTPUT: ${{ inputs.sops-output }}
        run: |
          node -e '
            const fs = require("fs");
            const wanted = process.env.KEYS.trim() === "all" ? null : new Set(process.env.KEYS.split(/\s+/));
            const out = {};
            for (const line of fs.readFileSync(process.env.SOPS_OUTPUT, "utf8").split("\n")) {
              const m = line.match(/^([A-Za-z_][A-Za-z0-9_]*)=(.*)$/);
              if (m && (!wanted || wanted.has(m[1])) && !m[1].startsWith("CLOUDFLARE_")) out[m[1]] = m[2].replace(/^"(.*)"$/, "$1");
            }
            fs.writeFileSync("/tmp/worker-secrets.json", JSON.stringify(out));
            console.log(`syncing ${Object.keys(out).length} secret(s)`);
          '
          npx --yes wrangler secret bulk /tmp/worker-secrets.json ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}
          rm -f /tmp/worker-secrets.json

      - name: Build
        if: inputs.build-command != ''
        env:
          COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$COMMAND"

      - name: Apply D1 migrations
        if: inputs.d1-database != ''
        env:
          DATABASE: ${{ inputs.d1-database }}
        run: npx --yes wrangler d1 migrations apply "$DATABASE" --remote ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

      - name: Deploy
        run: npx --yes wrangler deploy ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

      - name: Summary
        if: always()
        env:
          DIRECTORY: ${{ inputs.working-directory }}
          STATUS: ${{ job.status }}
        run: |
          echo "Cloudflare Worker in \`$DIRECTORY\` ${WRANGLER_ENV:+(env $WRANGLER_ENV) }deploy of \`${GITHUB_SHA::7}\`: **$STATUS**" >> "$GITHUB_STEP_SUMMARY"
