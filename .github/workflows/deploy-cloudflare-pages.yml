# Reusable Cloudflare Pages deploy for the Elixpo CI network.
# Covers static exports (`next build` → out) and next-on-pages builds (→ .vercel/output/static).
#
#   jobs:
#     deploy:
#       uses: elixpo/agent.elixpo/.github/workflows/deploy-cloudflare-pages.yml@main
#       with:
#         project-name: my-pages-project
#         build-command: npm run build
#         output-directory: out
#       secrets: inherit
#
# Optional: decrypt a sops-encrypted .env (sops-file), sync selected keys from it as Pages
# secrets (secret-keys), apply D1 migrations (d1-database), and set public build variables
# (build-env, one KEY=VALUE per line).

name: Deploy Cloudflare Pages

on:
  workflow_call:
    inputs:
      project-name:
        description: Cloudflare Pages project name
        type: string
        required: true
      build-command:
        description: Command that produces the deployable output
        type: string
        required: true
      output-directory:
        description: Directory to upload, relative to working-directory
        type: string
        required: true
      working-directory:
        type: string
        default: "."
      node-version:
        type: string
        default: "22"
      branch:
        description: Pages branch to deploy to (the production branch publishes to the custom domain)
        type: string
        default: main
      pre-build-command:
        description: Checks to run before building (registry validation, tests)
        type: string
        default: ""
      build-env:
        description: Public build-time variables, one KEY=VALUE per line
        type: string
        default: ""
      sops-file:
        description: sops-encrypted dotenv file to decrypt before building (empty to skip)
        type: string
        default: ""
      sops-output:
        type: string
        default: .env.local
      secret-keys:
        description: Space-separated keys from the decrypted env to sync as Pages secrets, or "all"
        type: string
        default: ""
      d1-database:
        description: D1 database whose migrations are applied remotely before deploy
        type: string
        default: ""
      environment:
        description: GitHub environment that gates the deploy
        type: string
        default: production
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      SOPS_AGE_KEY:
        required: false
      CI_SOPS_AGE_KEY:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    concurrency:
      group: pages-${{ github.repository }}-${{ inputs.project-name }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Decrypt environment
        if: inputs.sops-file != ''
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY || secrets.CI_SOPS_AGE_KEY }}
          SOPS_FILE: ${{ inputs.sops-file }}
          SOPS_OUTPUT: ${{ inputs.sops-output }}
        run: |
          if [ -z "$SOPS_AGE_KEY" ]; then echo "::error::sops-file is set but no SOPS_AGE_KEY or CI_SOPS_AGE_KEY secret is available"; exit 1; fi
          curl -fsSLo /tmp/sops https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          echo "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  /tmp/sops" | sha256sum --check --quiet
          chmod +x /tmp/sops
          /tmp/sops --decrypt --input-type dotenv --output-type dotenv "$SOPS_FILE" > "$SOPS_OUTPUT"
          while IFS='=' read -r key value; do
            [ -n "$value" ] && [ "${key#\#}" = "$key" ] && echo "::add-mask::$value"
          done < "$SOPS_OUTPUT"

      - name: Set build variables
        if: inputs.build-env != ''
        env:
          BUILD_ENV: ${{ inputs.build-env }}
        run: printf '%s\n' "$BUILD_ENV" | grep -E '^[A-Z_][A-Z0-9_]*=' >> "$GITHUB_ENV"

      - name: Pre-build checks
        if: inputs.pre-build-command != ''
        env:
          COMMAND: ${{ inputs.pre-build-command }}
        run: bash -euo pipefail -c "$COMMAND"

      - name: Sync Pages secrets
        if: inputs.secret-keys != '' && inputs.sops-file != ''
        env:
          KEYS: ${{ inputs.secret-keys }}
          SOPS_OUTPUT: ${{ inputs.sops-output }}
          PROJECT: ${{ inputs.project-name }}
        run: |
          node -e '
            const fs = require("fs");
            const wanted = process.env.KEYS.trim() === "all" ? null : new Set(process.env.KEYS.split(/\s+/));
            const out = {};
            for (const line of fs.readFileSync(process.env.SOPS_OUTPUT, "utf8").split("\n")) {
              const m = line.match(/^([A-Za-z_][A-Za-z0-9_]*)=(.*)$/);
              if (m && (!wanted || wanted.has(m[1])) && !m[1].startsWith("CLOUDFLARE_")) out[m[1]] = m[2].replace(/^"(.*)"$/, "$1");
            }
            fs.writeFileSync("/tmp/pages-secrets.json", JSON.stringify(out));
            console.log(`syncing ${Object.keys(out).length} secret(s)`);
          '
          npx --yes wrangler pages secret bulk /tmp/pages-secrets.json --project-name "$PROJECT"
          rm -f /tmp/pages-secrets.json

      - name: Build
        env:
          COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$COMMAND"

      - name: Apply D1 migrations
        if: inputs.d1-database != ''
        env:
          DATABASE: ${{ inputs.d1-database }}
        run: npx --yes wrangler d1 migrations apply "$DATABASE" --remote

      - name: Deploy
        env:
          OUTPUT: ${{ inputs.output-directory }}
          PROJECT: ${{ inputs.project-name }}
          BRANCH: ${{ inputs.branch }}
        run: npx --yes wrangler pages deploy "$OUTPUT" --project-name "$PROJECT" --branch "$BRANCH" --commit-hash "$GITHUB_SHA" --commit-dirty=true

      - name: Summary
        if: always()
        env:
          PROJECT: ${{ inputs.project-name }}
          STATUS: ${{ job.status }}
        run: |
          echo "Cloudflare Pages \`$PROJECT\` deploy of \`${GITHUB_SHA::7}\`: **$STATUS**" >> "$GITHUB_STEP_SUMMARY"
