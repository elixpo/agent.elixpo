# Reusable Cloudflare Pages deploy for the Elixpo CI network.
# Covers static exports (`next build` → out) and next-on-pages builds (→ .vercel/output/static).
#
#   jobs:
#     deploy:
#       uses: elixpo/agent.elixpo/.github/workflows/deploy-cloudflare-pages.yml@main
#       with:
#         project-name: my-pages-project
#         build-command: npm run build
#         output-directory: out
#       secrets: inherit
#
# Optional: decrypt a sops-encrypted .env (sops-file), sync selected keys from it as Pages
# secrets (secret-keys), apply D1 migrations (d1-database), and set public build variables
# (build-env, one KEY=VALUE per line).

name: Deploy Cloudflare Pages

on:
  workflow_call:
    inputs:
      project-name:
        description: Cloudflare Pages project name
        type: string
        required: true
      build-command:
        description: Command that produces the deployable output
        type: string
        required: true
      output-directory:
        description: Directory to upload, relative to working-directory
        type: string
        required: true
      working-directory:
        type: string
        default: "."
      node-version:
        type: string
        default: "22"
      branch:
        description: Pages branch to deploy to (the production branch publishes to the custom domain)
        type: string
        default: main
      pre-build-command:
        description: Checks to run before building (registry validation, tests)
        type: string
        default: ""
      build-env:
        description: Public build-time variables, one KEY=VALUE per line
        type: string
        default: ""
      sops-file:
        description: sops-encrypted dotenv file to decrypt before building (empty to skip)
        type: string
        default: ""
      sops-output:
        type: string
        default: .env.local
      secret-keys:
        description: Space-separated keys or globs from the decrypted env to sync as Pages secrets ("all" or * for every key)
        type: string
        default: ""
      secret-exclude:
        description: Space-separated keys or globs (e.g. NEXT_PUBLIC_*) left out of secret-keys; keys named exactly in secret-keys still sync
        type: string
        default: ""
      secret-map:
        description: Secrets synced under another name, one TARGET=SOURCE_KEY per line (value read from the decrypted env)
        type: string
        default: ""
      secret-values:
        description: Non-secret constants synced as runtime variables, one KEY=value per line
        type: string
        default: ""
      d1-database:
        description: D1 database whose migrations are applied remotely before deploy
        type: string
        default: ""
      environment:
        description: GitHub environment that gates the deploy
        type: string
        default: production
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      SOPS_AGE_KEY:
        required: false
      CI_SOPS_AGE_KEY:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    concurrency:
      group: pages-${{ github.repository }}-${{ inputs.project-name }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) != '' && 'npm' || '' }}
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci
          elif [ -f package.json ]; then npm install --no-audit --no-fund
          else echo "No package.json here; wrangler runs through npx."
          fi

      - name: Decrypt environment
        if: inputs.sops-file != ''
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY || secrets.CI_SOPS_AGE_KEY }}
          SOPS_FILE: ${{ inputs.sops-file }}
          SOPS_OUTPUT: ${{ inputs.sops-output }}
        run: |
          if [ -z "$SOPS_AGE_KEY" ]; then echo "::error::sops-file is set but no SOPS_AGE_KEY or CI_SOPS_AGE_KEY secret is available"; exit 1; fi
          curl -fsSLo /tmp/sops https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          echo "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  /tmp/sops" | sha256sum --check --quiet
          chmod +x /tmp/sops
          /tmp/sops --decrypt --input-type dotenv --output-type dotenv "$SOPS_FILE" > "$SOPS_OUTPUT"
          while IFS='=' read -r key value; do
            [ -n "$value" ] && [ "${key#\#}" = "$key" ] && echo "::add-mask::$value"
          done < "$SOPS_OUTPUT"

      - name: Set build variables
        if: inputs.build-env != ''
        env:
          BUILD_ENV: ${{ inputs.build-env }}
        run: printf '%s\n' "$BUILD_ENV" | grep -E '^[A-Z_][A-Z0-9_]*=' >> "$GITHUB_ENV"

      - name: Pre-build checks
        if: inputs.pre-build-command != ''
        env:
          COMMAND: ${{ inputs.pre-build-command }}
        run: bash -euo pipefail -c "$COMMAND"

      - name: Sync Pages secrets
        if: inputs.secret-values != '' || (inputs.sops-file != '' && (inputs.secret-keys != '' || inputs.secret-map != ''))
        env:
          KEYS: ${{ inputs.secret-keys }}
          EXCLUDE: ${{ inputs.secret-exclude }}
          MAP: ${{ inputs.secret-map }}
          VALUES: ${{ inputs.secret-values }}
          SOPS_OUTPUT: ${{ inputs.sops-output }}
          PROJECT: ${{ inputs.project-name }}
        run: |
          cat > /tmp/build-secrets.cjs <<'JS'
          const fs = require("fs");
          const env = {};
          if (process.env.SOPS_OUTPUT && fs.existsSync(process.env.SOPS_OUTPUT)) {
            for (const line of fs.readFileSync(process.env.SOPS_OUTPUT, "utf8").split("\n")) {
              const m = line.match(/^([A-Za-z_][A-Za-z0-9_]*)=(.*)$/);
              if (m) env[m[1]] = m[2].replace(/^"(.*)"$/, "$1");
            }
          }
          const words = (value) => (value || "").split(/\s+/).filter(Boolean);
          const pattern = (glob) => new RegExp("^" + glob.replace(/[.+?^${}()|[\]\\]/g, "\\$&").replace(/\*/g, ".*") + "$");
          const include = words(process.env.KEYS).map((k) => (k === "all" ? "*" : k));
          const exclude = words(process.env.EXCLUDE);
          const named = new Set(include.filter((k) => !k.includes("*")));
          const out = {};
          for (const [key, value] of Object.entries(env)) {
            if (key.startsWith("CLOUDFLARE_") || !value) continue;
            if (!include.some((p) => pattern(p).test(key))) continue;
            if (!named.has(key) && exclude.some((p) => pattern(p).test(key))) continue;
            out[key] = value;
          }
          for (const line of (process.env.MAP || "").split("\n").map((l) => l.trim()).filter(Boolean)) {
            const m = line.match(/^([A-Za-z_][A-Za-z0-9_]*)=([A-Za-z_][A-Za-z0-9_]*)$/);
            if (!m || !env[m[2]]) { console.error(`::error::secret-map entry "${line}" needs TARGET=SOURCE with a non-empty SOURCE in the decrypted env`); process.exit(1); }
            out[m[1]] = env[m[2]];
          }
          for (const line of (process.env.VALUES || "").split("\n").map((l) => l.trim()).filter(Boolean)) {
            const m = line.match(/^([A-Za-z_][A-Za-z0-9_]*)=(.+)$/);
            if (!m) { console.error(`::error::secret-values entry "${line}" must be KEY=value`); process.exit(1); }
            out[m[1]] = m[2];
          }
          fs.writeFileSync(process.argv[2], JSON.stringify(out));
          console.log(`syncing ${Object.keys(out).length} secret(s): ${Object.keys(out).sort().join(", ")}`);
          JS
          node /tmp/build-secrets.cjs /tmp/runtime-secrets.json
          npx --yes wrangler pages secret bulk /tmp/runtime-secrets.json --project-name "$PROJECT"
          rm -f /tmp/runtime-secrets.json /tmp/build-secrets.cjs

      - name: Build
        env:
          COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$COMMAND"

      - name: Apply D1 migrations
        if: inputs.d1-database != ''
        env:
          DATABASE: ${{ inputs.d1-database }}
        run: npx --yes wrangler d1 migrations apply "$DATABASE" --remote

      - name: Deploy
        env:
          OUTPUT: ${{ inputs.output-directory }}
          PROJECT: ${{ inputs.project-name }}
          BRANCH: ${{ inputs.branch }}
        run: npx --yes wrangler pages deploy "$OUTPUT" --project-name "$PROJECT" --branch "$BRANCH" --commit-hash "$GITHUB_SHA" --commit-dirty=true

      - name: Summary
        if: always()
        env:
          PROJECT: ${{ inputs.project-name }}
          STATUS: ${{ job.status }}
        run: |
          echo "Cloudflare Pages \`$PROJECT\` deploy of \`${GITHUB_SHA::7}\`: **$STATUS**" >> "$GITHUB_STEP_SUMMARY"
